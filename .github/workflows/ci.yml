name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm biome ci .
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Testes
        run: |
          pnpm --filter @anotai/desktop test
          cargo test --workspace

      - name: Build do front-end
        run: pnpm --filter @anotai/desktop build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes do interpretador
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Build do APK
        run: ./gradlew :app:assembleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: anotai-android-apk
          path: apps/android/app/build/outputs/apk/release/app-release.apk
