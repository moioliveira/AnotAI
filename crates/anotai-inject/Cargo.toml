[package]
name = "anotai-inject"
description = "Detecta o campo editável e insere o texto (UI Automation, SendInput, clipboard)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true

[lints]
workspace = true

[target."cfg(windows)".dependencies]
arboard = { version = "3.7.0", default-features = false }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_System_Com"] }
