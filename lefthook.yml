pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,json,css}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check

commit-msg:
  commands:
    conventional:
      run: node scripts/check-commit-msg.mjs {1}
