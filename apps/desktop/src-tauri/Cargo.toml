[package]
name = "anotai-desktop"
description = "AnotAI para desktop (Tauri 2)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "anotai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
anotai-core.workspace = true
serde.workspace = true
serde_json.workspace = true
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-log = "2.10.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-store = "2.5.0"
tauri-plugin-notification = "2.8.0"
anotai-hotkey.workspace = true
anotai-audio.workspace = true
anotai-platform.workspace = true
anotai-stt.workspace = true
anotai-postproc.workspace = true
anotai-inject.workspace = true
anotai-store.workspace = true
anotai-vad.workspace = true
reqwest.workspace = true
tokio.workspace = true
keyring = { version = "4.2.0", default-features = false, features = ["v1", "windows-native-keyring-store"] }
sha2 = "0.11.1"

[lints]
workspace = true
